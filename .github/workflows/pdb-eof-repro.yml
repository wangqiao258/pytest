name: pdb-eof-repro

on:
  push:
    branches: [ci/pdb-eof-repro]
  workflow_dispatch:

jobs:
  before:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore the master version of the test file
        run: |
          base=$(git merge-base origin/main HEAD)
          git show "$base:testing/test_debugging.py" > testing/test_debugging.py
          git diff --stat
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pexpect pytest-xdist
      - name: Run 50 rounds
        run: |
          set +e
          fails=0
          : > /tmp/all-fails.txt
          for i in $(seq 1 50); do
            python -m pytest testing/test_debugging.py -q -p no:cacheprovider -n 4 --tb=line \
              > /tmp/run.log 2>&1 || {
                fails=$((fails + 1))
                grep -E '^FAILED ' /tmp/run.log >> /tmp/all-fails.txt
                cp /tmp/run.log "/tmp/fail-${fails}.log"
              }
          done
          echo "BEFORE_RESULT: ${fails} / 50 rounds failed"
          sort /tmp/all-fails.txt | uniq -c | sort -rn

  after:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pexpect pytest-xdist
      - name: Run 50 rounds
        run: |
          set +e
          fails=0
          for i in $(seq 1 50); do
            python -m pytest testing/test_debugging.py -q -p no:cacheprovider -n 4 --tb=line \
              > /tmp/run.log 2>&1 || fails=$((fails + 1))
          done
          echo "AFTER_RESULT: ${fails} / 50 rounds failed"
