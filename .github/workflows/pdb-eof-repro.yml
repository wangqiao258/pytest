name: pdb-eof-all-actions

on:
  push:
    branches: [ci/pdb-eof-repro]
  workflow_dispatch:

jobs:
  before:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore the master version of the test file
        run: |
          base=$(git merge-base origin/main HEAD)
          git show "$base:testing/test_debugging.py" > testing/test_debugging.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pexpect pytest-xdist
      - name: "Natural load: 100 rounds, -n 4"
        run: |
          set +e
          fails=0
          : > /tmp/nfails.txt
          for i in $(seq 1 100); do
            python -m pytest testing/test_debugging.py -q -p no:cacheprovider -n 4 --tb=line \
              > /tmp/n.log 2>&1 || {
                fails=$((fails + 1))
                grep -E '^FAILED ' /tmp/n.log >> /tmp/nfails.txt
              }
          done
          echo "BEFORE_NATURAL: ${fails} / 100 rounds failed"
          sort /tmp/nfails.txt | uniq -c | sort -rn
      - name: "Stress: 50 rounds, -n 6 with 2 cpu hogs"
        run: |
          set +e
          for j in 1 2; do (while :; do :; done) & done
          hogs=$(jobs -p)
          fails=0
          : > /tmp/sfails.txt
          for i in $(seq 1 50); do
            python -m pytest testing/test_debugging.py -q -p no:cacheprovider -n 6 --tb=line \
              > /tmp/s.log 2>&1 || {
                fails=$((fails + 1))
                grep -E '^FAILED ' /tmp/s.log >> /tmp/sfails.txt
              }
          done
          kill $hogs 2>/dev/null
          echo "BEFORE_STRESS: ${fails} / 50 rounds failed"
          sort /tmp/sfails.txt | uniq -c | sort -rn

  after:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pexpect pytest-xdist
      - name: "Natural load: 100 rounds, -n 4"
        run: |
          set +e
          fails=0
          for i in $(seq 1 100); do
            python -m pytest testing/test_debugging.py -q -p no:cacheprovider -n 4 --tb=line \
              > /tmp/n.log 2>&1 || fails=$((fails + 1))
          done
          echo "AFTER_NATURAL: ${fails} / 100 rounds failed"
      - name: "Stress: 50 rounds, -n 6 with 2 cpu hogs"
        run: |
          set +e
          for j in 1 2; do (while :; do :; done) & done
          hogs=$(jobs -p)
          fails=0
          for i in $(seq 1 50); do
            python -m pytest testing/test_debugging.py -q -p no:cacheprovider -n 6 --tb=line \
              > /tmp/s.log 2>&1 || fails=$((fails + 1))
          done
          kill $hogs 2>/dev/null
          echo "AFTER_STRESS: ${fails} / 50 rounds failed"
